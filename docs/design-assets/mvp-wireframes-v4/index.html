<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Petmate MVP Wireframes v4</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; background: #f4f5f7; }
    body {
      margin: 0;
      padding: 32px;
      color: #1a1c1f;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #62666d; }
    main {
      display: grid;
      grid-template-columns: repeat(4, 220px);
      gap: 28px 20px;
    }
    figure { margin: 0; }
    img {
      display: block;
      width: 220px;
      height: 550px;
      object-fit: cover;
      object-position: top;
      border: 1px solid #dfe1e5;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(26 28 31 / 8%);
    }
    figcaption {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>My Petmate MVP Wireframes v4</h1>
  <p>Backend MVP 동작을 기준으로 정의한 24개 화면</p>
  <main>
    <figure><img src="01-auth-01-login.png" alt=""><figcaption>01 · AUTH-01 로그인</figcaption></figure>
    <figure><img src="02-auth-02-signup.png" alt=""><figcaption>02 · AUTH-02 회원가입</figcaption></figure>

    <figure><img src="07-dog-04-behavior.png" alt=""><figcaption>07 · DOG-04 성향과 행동</figcaption></figure>
    <figure><img src="08-dog-05-area-time.png" alt=""><figcaption>08 · DOG-05 지역·시간·소개</figcaption></figure>
    <figure><img src="09-dog-06-detail.png" alt=""><figcaption>09 · DOG-06 반려견 상세</figcaption></figure>
    <figure><img src="10-guardian-01-visibility.png" alt=""><figcaption>10 · GUARDIAN-01 보호자 정보 공개 설정</figcaption></figure>

</html>
